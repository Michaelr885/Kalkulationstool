<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rohrleitungskalkulation</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-elevated: #252525;
      --primary: #2196f3;
      --primary-dim: rgba(33, 150, 243, 0.18);
      --secondary: #03dac6;
      --secondary-dim: rgba(3, 218, 198, 0.14);
      --on-surface: rgba(255, 255, 255, 0.92);
      --on-surface-muted: rgba(255, 255, 255, 0.58);
      --border: rgba(255, 255, 255, 0.1);
      --danger: #cf6679;
      --radius: 12px;
      --touch: 48px;
      --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--on-surface);
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select {
      font: inherit;
      color: inherit;
    }

    .app {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .app { flex-direction: row; }
    }

    .sidebar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      .sidebar {
        width: 300px;
        min-height: 100vh;
        border-bottom: none;
        border-right: 1px solid var(--border);
      }
    }

    .project-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--secondary);
      word-break: break-word;
    }

    .sidebar-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--on-surface-muted);
      margin-bottom: 8px;
    }

    .section-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 36vh;
      overflow-y: auto;
    }

    @media (min-width: 768px) {
      .section-list {
        max-height: none;
        flex: 1;
        min-height: 100px;
      }
    }

    .section-item {
      min-height: var(--touch);
      padding: 0 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      display: flex;
      align-items: center;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
    }

    .section-item:hover { border-color: rgba(33, 150, 243, 0.45); }

    .section-item.active {
      border-color: var(--primary);
      background: var(--primary-dim);
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 480px) {
      .toolbar { flex-direction: row; flex-wrap: wrap; }
    }

    .btn {
      min-height: var(--touch);
      padding: 0 18px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s, transform 0.08s;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-secondary {
      background: var(--surface-elevated);
      color: var(--on-surface);
      border: 1px solid var(--border);
    }

    .btn-accent {
      background: var(--secondary-dim);
      color: var(--secondary);
      border: 1px solid rgba(3, 218, 198, 0.35);
    }

    .btn-danger {
      background: rgba(207, 102, 121, 0.22);
      color: var(--danger);
      border: 1px solid rgba(207, 102, 121, 0.45);
    }

    .btn-block { width: 100%; }

    .hidden-file {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow: auto;
      min-width: 0;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      border: 1px solid var(--border);
    }

    .material-toggle {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .material-btn {
      flex: 1;
      min-width: 140px;
      min-height: 56px;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      background: var(--surface-elevated);
      cursor: pointer;
      font-weight: 600;
      font-size: 1.05rem;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .material-btn.active-es {
      border-color: var(--primary);
      background: var(--primary-dim);
      color: var(--primary);
    }

    .material-btn.active-stahl {
      border-color: var(--secondary);
      background: var(--secondary-dim);
      color: var(--secondary);
    }

    .einsatz-toggle {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .einsatz-btn {
      flex: 1;
      min-width: 140px;
      min-height: 56px;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      background: var(--surface-elevated);
      cursor: pointer;
      font-weight: 600;
      font-size: 1.05rem;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .einsatz-btn.active-montage {
      border-color: var(--primary);
      background: var(--primary-dim);
      color: var(--primary);
    }

    .einsatz-btn.active-demontage {
      border-color: var(--secondary);
      background: var(--secondary-dim);
      color: var(--secondary);
    }

    .counter-block-title {
      font-size: 0.88rem;
      color: var(--on-surface-muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .counter-block-title.spaced {
      margin-top: 18px;
    }

    .field-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-row label {
      font-size: 0.88rem;
      color: var(--on-surface-muted);
    }

    .field-row input[type="text"] {
      min-height: var(--touch);
      padding: 0 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .field-row input:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .dn-dropdown {
      position: relative;
      z-index: 30;
    }

    .dn-dropdown-trigger {
      width: 100%;
      min-height: var(--touch);
      padding: 0 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--on-surface);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      transition: border-color 0.15s;
    }

    .dn-dropdown-trigger:hover {
      border-color: rgba(33, 150, 243, 0.45);
    }

    .dn-dropdown-trigger:focus {
      outline: none;
    }

    .dn-dropdown-trigger:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .dn-dropdown-chevron {
      flex-shrink: 0;
      font-size: 0.65rem;
      color: var(--on-surface-muted);
    }

    .dn-dropdown-panel {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      max-height: min(46vh, 300px);
      overflow-y: auto;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      z-index: 200;
    }

    .dn-dropdown.open .dn-dropdown-panel {
      display: block;
    }

    .dn-dropdown-option {
      display: block;
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--on-surface);
      font: inherit;
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
    }

    .dn-dropdown-option:last-child {
      border-bottom: none;
    }

    .dn-dropdown-option:hover {
      background: rgba(33, 150, 243, 0.12);
    }

    .dn-dropdown-option.active {
      background: var(--primary-dim);
      color: var(--primary);
      font-weight: 600;
    }

    .counter-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 520px) {
      .counter-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 900px) {
      .counter-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .counter-btn {
      min-height: 56px;
      padding: 14px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      transition: border-color 0.15s, background 0.15s;
    }

    .counter-btn:hover { border-color: var(--primary); }

    .counter-btn small {
      display: block;
      font-weight: 400;
      font-size: 0.78rem;
      color: var(--on-surface-muted);
      margin-top: 4px;
    }

    .summary-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      padding: 14px;
      background: var(--surface-elevated);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .summary-bar strong { color: var(--primary); }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .list-header h2 {
      margin: 0;
      font-size: 1.08rem;
    }

    .line-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .line-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      min-height: var(--touch);
      padding: 10px 14px;
      background: var(--surface-elevated);
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .line-item-main {
      flex: 1;
      min-width: 140px;
    }

    .line-item-edit {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .line-item-qty {
      min-height: 44px;
      width: 5.5rem;
      padding: 0 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--on-surface);
      font-size: 1rem;
      text-align: right;
    }

    .line-item-qty:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .line-item-unit {
      font-size: 0.85rem;
      color: var(--on-surface-muted);
      min-width: 2rem;
    }

    .line-item-meta {
      font-size: 0.78rem;
      color: var(--on-surface-muted);
    }

    .empty-hint {
      color: var(--on-surface-muted);
      padding: 24px;
      text-align: center;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      border: 1px solid var(--border);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
    }

    .modal h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }

    .modal p {
      margin: 0 0 16px;
      color: var(--on-surface-muted);
      font-size: 0.9rem;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface-elevated);
      color: var(--on-surface);
      padding: 14px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      z-index: 1100;
      opacity: 0;
      transition: transform 0.25s, opacity 0.25s;
      max-width: min(90vw, 400px);
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.error {
      border-color: var(--danger);
      color: var(--danger);
    }

    h1.page-title {
      margin: 0;
      font-size: 1.32rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
(function () {
  "use strict";

  var STORAGE_KEY = "rohrkalkulation_v2";

  /** Nennweiten DN 15 … DN 300 (übliche Normreihe, Anzeige „DN 15“). */
  var STANDARD_DN_LABELS = [15, 20, 25, 32, 40, 50, 65, 80, 100, 125, 150, 200, 250, 300].map(function (n) {
    return "DN " + n;
  });

  var dnGlobalListenersBound = false;

  function uid() {
    return "id_" + Math.random().toString(36).slice(2, 11) + Date.now().toString(36);
  }

  function nowIso() {
    return new Date().toISOString();
  }

  function defaultState() {
    return {
      version: 2,
      projectName: "",
      sections: [],
      activeSectionId: null
    };
  }

  function createSection(name) {
    return {
      id: uid(),
      name: name.trim() || "Abschnitt",
      material: "edelstahl",
      dn: STANDARD_DN_LABELS[0],
      einsatz: "montage",
      lineItems: []
    };
  }

  var state = defaultState();

  var els = {
    app: document.getElementById("app"),
    toast: document.getElementById("toast")
  };

  var toastTimer = null;
  function showToast(message, isError, durationMs) {
    els.toast.textContent = message;
    els.toast.classList.toggle("error", !!isError);
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    var ms = typeof durationMs === "number" && durationMs > 0 ? durationMs : 3200;
    toastTimer = setTimeout(function () {
      els.toast.classList.remove("show");
    }, ms);
  }

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      showToast("Speichern fehlgeschlagen: " + (e.message || "Unbekannt"), true);
    }
  }

  function loadFromStorage() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object") return false;
      if (typeof parsed.projectName !== "string") parsed.projectName = "";
      if (!Array.isArray(parsed.sections)) parsed.sections = [];
      parsed.sections = parsed.sections.map(function (s) {
        if (!s || typeof s !== "object") return createSection("Abschnitt");
        return {
          id: typeof s.id === "string" ? s.id : uid(),
          name: typeof s.name === "string" ? s.name : "Abschnitt",
          material: s.material === "stahl" ? "stahl" : "edelstahl",
          dn: (function () {
            var d = typeof s.dn === "string" || typeof s.dn === "number" ? String(s.dn) : "";
            return d.trim() ? d : STANDARD_DN_LABELS[0];
          })(),
          einsatz: s.einsatz === "demontage" ? "demontage" : "montage",
          lineItems: Array.isArray(s.lineItems)
            ? s.lineItems.filter(function (li) {
                return li && typeof li === "object" && typeof li.id === "string" && typeof li.type === "string";
              }).map(function (li) {
                return {
                  id: li.id,
                  type: li.type,
                  label: typeof li.label === "string" ? li.label : "",
                  value: typeof li.value === "number" && !isNaN(li.value)
                    ? li.value
                    : li.type === "rohr" || li.type === "rohr_demontage"
                      ? 0.5
                      : 1,
                  createdAt: typeof li.createdAt === "string" ? li.createdAt : nowIso()
                };
              })
            : []
        };
      });
      parsed.sections.forEach(function (sec) {
        mergeDuplicateLinesByType(sec);
        stripObsoleteLineItems(sec);
      });
      if (typeof parsed.activeSectionId !== "string" || !parsed.sections.some(function (x) { return x.id === parsed.activeSectionId; })) {
        parsed.activeSectionId = parsed.sections[0] ? parsed.sections[0].id : null;
      }
      state = {
        version: 2,
        projectName: parsed.projectName,
        sections: parsed.sections,
        activeSectionId: parsed.activeSectionId
      };
      return true;
    } catch (e) {
      showToast("Lokale Daten beschädigt — neu starten.", true);
      return false;
    }
  }

  function getActiveSection() {
    if (!state.activeSectionId) return null;
    for (var i = 0; i < state.sections.length; i++) {
      if (state.sections[i].id === state.activeSectionId) return state.sections[i];
    }
    return null;
  }

  function sumRohrMeters(section) {
    var m = 0;
    section.lineItems.forEach(function (li) {
      if (li.type === "rohr") m += li.value;
    });
    return m;
  }

  function countType(section, type) {
    var n = 0;
    section.lineItems.forEach(function (li) {
      if (li.type === type) n += li.value;
    });
    return n;
  }

  function sumRohrMetersDemontage(section) {
    var m = 0;
    section.lineItems.forEach(function (li) {
      if (li.type === "rohr_demontage") m += li.value;
    });
    return m;
  }

  /**
   * Automatische Messpunkte nur aus Montage-Bauteilen:
   * je angefangene 6 m Rohr (Montage) + je 1 Bogen (Montage) + je 1 T-Stück (Montage).
   * Demontage fließt nicht ein; Messpunkte bei Demontage gibt es nicht.
   */
  function autoMesspunkte(section) {
    var rohr = sumRohrMeters(section);
    var ausRohr = rohr > 0 ? Math.ceil(rohr / 6) : 0;
    var bogen = countType(section, "bogen");
    var tStueck = countType(section, "t_stueck");
    return ausRohr + bogen + tStueck;
  }

  function materialLabel(m) {
    return m === "stahl" ? "Stahl" : "Edelstahl";
  }

  function formatDeDecimal(num) {
    var s = String(num);
    if (s.indexOf("e") !== -1 || s.indexOf("E") !== -1) {
      s = num.toFixed(4);
    }
    return s.replace(".", ",");
  }

  function downloadText(filename, text, mime) {
    var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 0);
  }

  function exportProjectJson() {
    var payload = JSON.stringify(state, null, 2);
    var safe = (state.projectName || "projekt").replace(/[^\wäöüÄÖÜß\- ]+/g, "").trim().replace(/\s+/g, "_") || "projekt";
    downloadText(safe + "_rohrkalkulation.json", payload, "application/json;charset=utf-8");
    showToast("Projekt als JSON gespeichert.");
  }

  function importProjectJson(text) {
    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      showToast("Ungültige JSON-Datei.", true);
      return;
    }
    if (!parsed || typeof parsed !== "object") {
      showToast("Ungültiges Projektformat.", true);
      return;
    }
    var prev = state;
    try {
      if (typeof parsed.projectName !== "string") throw new Error("projectName");
      if (!Array.isArray(parsed.sections)) throw new Error("sections");
      var newState = defaultState();
      newState.projectName = parsed.projectName;
      newState.sections = parsed.sections.map(function (s, idx) {
        if (!s || typeof s !== "object") throw new Error("section " + idx);
        return {
          id: typeof s.id === "string" ? s.id : uid(),
          name: typeof s.name === "string" ? s.name : "Abschnitt",
          material: s.material === "stahl" ? "stahl" : "edelstahl",
          dn: (function () {
            var d = s.dn != null ? String(s.dn) : "";
            return d.trim() ? d : STANDARD_DN_LABELS[0];
          })(),
          einsatz: s.einsatz === "demontage" ? "demontage" : "montage",
          lineItems: Array.isArray(s.lineItems)
            ? s.lineItems.map(function (li, j) {
                if (!li || typeof li !== "object") throw new Error("line " + j);
                return {
                  id: typeof li.id === "string" ? li.id : uid(),
                  type: typeof li.type === "string" ? li.type : "unknown",
                  label: typeof li.label === "string" ? li.label : "",
                  value:
                    typeof li.value === "number" && !isNaN(li.value)
                      ? li.value
                      : li.type === "rohr" || li.type === "rohr_demontage"
                        ? 0.5
                        : 1,
                  createdAt: typeof li.createdAt === "string" ? li.createdAt : nowIso()
                };
              })
            : []
        };
      });
      newState.sections.forEach(function (sec) {
        mergeDuplicateLinesByType(sec);
        stripObsoleteLineItems(sec);
      });
      newState.activeSectionId =
        typeof parsed.activeSectionId === "string" &&
        newState.sections.some(function (x) { return x.id === parsed.activeSectionId; })
          ? parsed.activeSectionId
          : newState.sections[0]
            ? newState.sections[0].id
            : null;
      state = newState;
      saveToStorage();
      render();
      showToast("Projekt geladen.");
    } catch (err) {
      state = prev;
      showToast("Projektdatei unvollständig oder beschädigt.", true);
    }
  }

  function buildCsvRows() {
    var rows = [];
    rows.push(["Abschnitt", "Material", "DN", "Bauteil", "Anzahl"]);
    state.sections.forEach(function (sec) {
      var mat = materialLabel(sec.material);
      var dn = sec.dn || "";
      var rohrM = sumRohrMeters(sec);
      if (rohrM > 0) {
        rows.push([sec.name, mat, dn, "Rohr (m) Montage", formatDeDecimal(rohrM)]);
      }
      var rohrD = sumRohrMetersDemontage(sec);
      if (rohrD > 0) {
        rows.push([sec.name, mat, dn, "Rohr (m) Demontage", formatDeDecimal(rohrD)]);
      }
      var bogen = countType(sec, "bogen");
      if (bogen > 0) rows.push([sec.name, mat, dn, "Bogen Montage", String(bogen)]);
      var bogenD = countType(sec, "bogen_demontage");
      if (bogenD > 0) rows.push([sec.name, mat, dn, "Bogen Demontage", String(bogenD)]);
      var tStueck = countType(sec, "t_stueck");
      if (tStueck > 0) rows.push([sec.name, mat, dn, "T-Stück Montage", String(tStueck)]);
      var tStueckD = countType(sec, "t_stueck_demontage");
      if (tStueckD > 0) rows.push([sec.name, mat, dn, "T-Stück Demontage", String(tStueckD)]);
      var schweiss = countType(sec, "schweissnaht");
      if (schweiss > 0) rows.push([sec.name, mat, dn, "Schweißnaht Montage", String(schweiss)]);
      var schweissD = countType(sec, "schweissnaht_demontage");
      if (schweissD > 0) rows.push([sec.name, mat, dn, "Schweißnaht Demontage", String(schweissD)]);
      var messMan = countType(sec, "messpunkt");
      var messAuto = autoMesspunkte(sec);
      var messGesamt = messMan + messAuto;
      if (messGesamt > 0) {
        rows.push([sec.name, mat, dn, "Messpunkt", String(messGesamt)]);
      }
    });
    return rows;
  }

  function csvEscape(cell) {
    var s = String(cell);
    if (/[",;\n\r]/.test(s)) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function exportCsv() {
    var rows = buildCsvRows();
    if (rows.length <= 1) {
      showToast("Keine Daten zum Exportieren.", true);
      return;
    }
    var lines = rows.map(function (r) {
      return r.map(csvEscape).join(";");
    });
    var bom = "\uFEFF";
    var csv = bom + lines.join("\r\n");
    var safe = (state.projectName || "export").replace(/[^\wäöüÄÖÜß\- ]+/g, "").trim().replace(/\s+/g, "_") || "export";
    downloadText(safe + "_rohrkalkulation.csv", csv, "text/csv;charset=utf-8");
    showToast("CSV exportiert (Excel-kompatibel).");
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/'/g, "&#39;");
  }

  function wireSidebar() {
    var list = document.getElementById("section-list");
    if (!list) return;

    state.sections.forEach(function (sec) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "section-item" + (sec.id === state.activeSectionId ? " active" : "");
      btn.textContent = sec.name;
      btn.addEventListener("click", function () {
        state.activeSectionId = sec.id;
        saveToStorage();
        render();
      });
      list.appendChild(btn);
    });

    document.getElementById("btn-new-section").addEventListener("click", function () {
      var name = window.prompt("Name des neuen Abschnitts:", "");
      if (name === null) return;
      var sec = createSection(name || "Neuer Abschnitt");
      state.sections.push(sec);
      state.activeSectionId = sec.id;
      saveToStorage();
      render();
    });

    document.getElementById("btn-save-json").addEventListener("click", exportProjectJson);

    var fileInput = document.getElementById("file-load-json");
    document.getElementById("btn-load-json").addEventListener("click", function () {
      fileInput.click();
    });
    fileInput.addEventListener("change", function () {
      var f = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        importProjectJson(String(reader.result || ""));
      };
      reader.onerror = function () {
        showToast("Datei konnte nicht gelesen werden.", true);
      };
      reader.readAsText(f, "UTF-8");

    document.getElementById("btn-export-csv").addEventListener("click", exportCsv);

    document.getElementById("btn-reset-alles").addEventListener("click", function () {

        )
      ) {
        return;
      }
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      location.reload();
    });
  }

  function addOrMergeLine(section, type, label, delta) {
    var existing = null;
    for (var i = 0; i < section.lineItems.length; i++) {
      if (section.lineItems[i].type === type) {
        existing = section.lineItems[i];
        break;
      }
    }
    if (existing) {
      existing.value += delta;
      existing.label = label;
    } else {
      section.lineItems.push({
        id: uid(),
        type: type,
        label: label,
        value: delta,
        createdAt: nowIso()
      });
    }
  }

  function stripObsoleteLineItems(section) {
    section.lineItems = section.lineItems.filter(function (li) {
      return li.type !== "messpunkt_demontage";
    });
  }

  function updateLineItemValue(section, lineId, rawStr) {
    var li = null;
    for (var j = 0; j < section.lineItems.length; j++) {
      if (section.lineItems[j].id === lineId) {
        li = section.lineItems[j];
        break;
      }
    }
    if (!li) return;
    var v = parseFloat(String(rawStr).replace(",", "."));
    if (isNaN(v)) return;
    if (li.type === "rohr" || li.type === "rohr_demontage") {
      if (v <= 0) {
        section.lineItems = section.lineItems.filter(function (x) {
          return x.id !== lineId;
        });
      } else {
        li.value = v;
      }
    } else {
      v = Math.round(v);
      if (v <= 0) {
        section.lineItems = section.lineItems.filter(function (x) {
          return x.id !== lineId;
        });
      } else {
        li.value = v;
      }
    }
    saveToStorage();
    render();
  }

  /** Altbestand: mehrere Zeilen gleichen Typs zu einer Zeile summieren. */
  function mergeDuplicateLinesByType(section) {
    var types = [
      "rohr",
      "bogen",
      "t_stueck",
      "schweissnaht",
      "messpunkt",
      "rohr_demontage",
      "bogen_demontage",
      "t_stueck_demontage",
      "schweissnaht_demontage"
    ];
    for (var t = 0; t < types.length; t++) {
      var typ = types[t];
      var parts = [];
      for (var i = 0; i < section.lineItems.length; i++) {
        if (section.lineItems[i].type === typ) parts.push(section.lineItems[i]);
      }
      if (parts.length <= 1) continue;
      var sum = 0;
      for (var j = 0; j < parts.length; j++) sum += parts[j].value;
      var keep = parts[0];
      section.lineItems = section.lineItems.filter(function (li) {
        return li.type !== typ;
      });
      section.lineItems.push({
        id: keep.id,
        type: typ,
        label: keep.label,
        value: sum,
        createdAt: keep.createdAt
      });
    }
  }

  function dnDropdownLabelText(dnStored) {
    var d = (dnStored || "").trim();
    if (!d) return "DN wählen";
    return d;
  }

  function setDnDropdownOpen(open) {
    var wrap = document.getElementById("dnDropdownWrap");
    var btn = document.getElementById("dnDropdownBtn");
    if (!wrap || !btn) return;
    wrap.classList.toggle("open", !!open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  function wireDnDropdown(active) {
    var wrap = document.getElementById("dnDropdownWrap");
    var btn = document.getElementById("dnDropdownBtn");
    var labelEl = document.getElementById("dnDropdownLabel");
    var panel = document.getElementById("dnDropdownPanel");
    if (!wrap || !btn || !labelEl || !panel) return;

    labelEl.textContent = dnDropdownLabelText(active.dn);

    panel.innerHTML = "";

    STANDARD_DN_LABELS.forEach(function (dnLabel) {
      var opt = document.createElement("button");
      opt.type = "button";
      opt.className = "dn-dropdown-option" + (dnLabel === active.dn ? " active" : "");
      opt.setAttribute("role", "option");
      opt.textContent = dnLabel;
      opt.addEventListener("click", function () {
        active.dn = dnLabel;
        saveToStorage();
        setDnDropdownOpen(false);
        render();
      });
      panel.appendChild(opt);
    });

    btn.onclick = function (e) {
      e.stopPropagation();
      setDnDropdownOpen(!wrap.classList.contains("open"));
    };
  }

  function wireMain(active) {
    document.querySelectorAll(".material-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var mat = btn.getAttribute("data-material");
        active.material = mat === "stahl" ? "stahl" : "edelstahl";
        saveToStorage();
        render();
      });
    });

    document.querySelectorAll(".einsatz-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var e = btn.getAttribute("data-einsatz");
        active.einsatz = e === "demontage" ? "demontage" : "montage";
        saveToStorage();
        render();
      });
    });

    wireDnDropdown(active);

    var labels = {
      rohr: "Rohr +0,5 m",
      bogen: "Bogen",
      t_stueck: "T-Stück",
      schweissnaht: "Schweißnaht",
      messpunkt: "Messpunkt (manuell)"
    };

    function labelMitDnUndMaterial(kurz) {
      var d = (active.dn || "").trim();
      var dnPart = d ? (" " + d.replace(/\s+/g, "")) : "";
      var mat = materialLabel(active.material);
      return kurz + dnPart + " · " + mat;
    }

    function labelMesspunktManuell() {
      return labels.messpunkt + " · " + materialLabel(active.material);
    }

    function wireCounterBtn(btn) {
      btn.addEventListener("click", function () {
        var action = btn.getAttribute("data-action");
        if (!(active.dn || "").trim()) {
          showToast("Bitte wählen Sie eine Nennweite (DN).", true, 4200);
          return;
        }
        if (action === "rohr") {
          addOrMergeLine(active, "rohr", labelMitDnUndMaterial("Rohr (m)"), 0.5);
        } else if (action === "bogen") {
          addOrMergeLine(active, "bogen", labelMitDnUndMaterial(labels.bogen), 1);
        } else if (action === "t_stueck") {
          addOrMergeLine(active, "t_stueck", labelMitDnUndMaterial(labels.t_stueck), 1);
        } else if (action === "schweissnaht") {
          addOrMergeLine(active, "schweissnaht", labelMitDnUndMaterial(labels.schweissnaht), 1);
        } else if (action === "messpunkt") {
          addOrMergeLine(active, "messpunkt", labelMesspunktManuell(), 1);
        } else if (action === "rohr_demontage") {
          addOrMergeLine(active, "rohr_demontage", labelMitDnUndMaterial("Rohr (m) · Demontage"), 0.5);
        } else if (action === "bogen_demontage") {
          addOrMergeLine(active, "bogen_demontage", labelMitDnUndMaterial(labels.bogen + " · Demontage"), 1);
        } else if (action === "t_stueck_demontage") {
          addOrMergeLine(active, "t_stueck_demontage", labelMitDnUndMaterial(labels.t_stueck + " · Demontage"), 1);
        } else if (action === "schweissnaht_demontage") {
          addOrMergeLine(active, "schweissnaht_demontage", labelMitDnUndMaterial(labels.schweissnaht + " · Demontage"), 1);
        }
        saveToStorage();
        render();
      });
    }

    var montWrap = document.getElementById("counter-montage");
    if (montWrap) {
      montWrap.querySelectorAll(".counter-btn").forEach(wireCounterBtn);
    }
    var demWrap = document.getElementById("counter-demontage");
    if (demWrap) {
      demWrap.querySelectorAll(".counter-btn").forEach(wireCounterBtn);
    }

    var container = document.getElementById("line-items");
    if (!container) return;

    var visible = [];
    for (var k = 0; k < active.lineItems.length; k++) {
      var lix = active.lineItems[k];
      var isDem = lix.type.indexOf("_demontage") !== -1;
      if (active.einsatz === "demontage") {
        if (isDem) visible.push(lix);
      } else {
        if (!isDem) visible.push(lix);
      }
    }

    if (visible.length === 0) {
      container.innerHTML = '<p class="empty-hint">Noch keine Einträge. Nutzen Sie die Zähler oben.</p>';
      return;
    }

    visible
      .slice()
      .reverse()
      .forEach(function (li) {
        var row = document.createElement("div");
        row.className = "line-item";
        var isRohr = li.type === "rohr" || li.type === "rohr_demontage";
        var unit = isRohr ? "m" : "Stk";

        var main = document.createElement("div");
        main.className = "line-item-main";
        var titleEl = document.createElement("div");
        titleEl.textContent = li.label;
        var meta = document.createElement("div");
        meta.className = "line-item-meta";
        meta.textContent = new Date(li.createdAt).toLocaleString("de-DE");
        main.appendChild(titleEl);
        main.appendChild(meta);

        var editWrap = document.createElement("div");
        editWrap.className = "line-item-edit";
        var input = document.createElement("input");
        input.type = "number";
        input.className = "line-item-qty";
        input.setAttribute("aria-label", isRohr ? "Meter Rohrleitung" : "Stückzahl");
        if (isRohr) {
          input.step = "0.1";
          input.min = "0";
        } else {
          input.step = "1";
          input.min = "0";
        }
        input.value = isRohr ? String(li.value) : String(Math.round(li.value));

        var unitSpan = document.createElement("span");
        unitSpan.className = "line-item-unit";
        unitSpan.textContent = unit;

        editWrap.appendChild(input);
        editWrap.appendChild(unitSpan);

        var delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "btn btn-danger";
        delBtn.style.minHeight = "44px";
        delBtn.style.padding = "0 14px";
        delBtn.textContent = "Löschen";

        var lid = li.id;
        delBtn.addEventListener("click", function () {
          active.lineItems = active.lineItems.filter(function (x) {
            return x.id !== lid;
          });
          saveToStorage();
          render();
        });

        input.addEventListener("change", function () {
          updateLineItemValue(active, lid, this.value);
        });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            this.blur();
          }
        });

        row.appendChild(main);
        row.appendChild(editWrap);
        row.appendChild(delBtn);
        container.appendChild(row);
      });
  }

  function init() {
    if (!dnGlobalListenersBound) {
      dnGlobalListenersBound = true;
      document.addEventListener("mousedown", function (ev) {
        var w = document.getElementById("dnDropdownWrap");
        if (!w || !w.classList.contains("open")) return;
        if (w.contains(ev.target)) return;
        setDnDropdownOpen(false);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key !== "Escape") return;
        var w = document.getElementById("dnDropdownWrap");
        if (w && w.classList.contains("open")) {
          e.preventDefault();
          setDnDropdownOpen(false);
          var b = document.getElementById("dnDropdownBtn");
          if (b) b.focus();
        }
      });
    }

    loadFromStorage();
    if (typeof state.projectName !== "string") state.projectName = "";
    if (!String(state.projectName).trim()) {
      state.projectName = "";
    }
    if (String(state.projectName).trim() && state.sections.length === 0) {
      var sec = createSection("Abschnitt 1");
      state.sections.push(sec);
      state.activeSectionId = sec.id;
      saveToStorage();
    }
    if (state.sections.length > 0 && !state.activeSectionId) {
      state.activeSectionId = state.sections[0].id;
      saveToStorage();
    }
    render();
  }

  init();
})();
  </script>
</body>
</html>
